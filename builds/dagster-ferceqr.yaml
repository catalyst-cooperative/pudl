run_coordinator:
  module: dagster
  class: QueuedRunCoordinator
  config:
    # Each partition run opens its own DuckDB connection; too many at once
    # oversubscribe the VM's cores and exhaust its RAM (see PUDL_DUCKDB_* in
    # builds/ferceqr_batch.sh). 12 heavy quarters is about what a
    # c4d-standard-32 (124 GiB) holds with those per-connection caps in place.
    max_concurrent_runs: 12
    # Launch dequeued runs in parallel. The default serial dequeue loop (one
    # launch per ~5s tick) can't refill freed slots fast enough when many short
    # partition backfill runs finish close together, so steady-state occupancy
    # sits well below max_concurrent_runs.
    dequeue_use_threads: true
    dequeue_num_workers: 8
