run_coordinator:
  module: dagster
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 16
    # Launch dequeued runs in parallel. The default serial dequeue loop (one
    # launch per ~5s tick) can't refill freed slots fast enough when many short
    # partition backfill runs finish close together, so steady-state occupancy
    # sits well below max_concurrent_runs.
    dequeue_use_threads: true
    dequeue_num_workers: 8
