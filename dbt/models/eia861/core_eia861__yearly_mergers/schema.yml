version: 2
sources:
  - name: pudl
    tables:
      - name: core_eia861__yearly_mergers
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - data_maturity
                pk_table_name: source('pudl', 'core_pudl__codes_data_maturities')
                pk_column_names:
                  - code
          - expect_columns_not_all_null:
              arguments:
                row_conditions:
                  entity_type: EXTRACT(year FROM report_date) <= 2011
                  state: EXTRACT(year FROM report_date) <= 2012
                  zip_code_4: EXTRACT(year FROM report_date) <= 2010
          - check_row_counts_per_partition:
              arguments:
                partition_expr: EXTRACT(YEAR FROM report_date)
        columns:
          - name: entity_type
          - name: merge_address
          - name: merge_city
          - name: merge_company
          - name: merge_date
          - name: merge_state
          - name: new_parent
          - name: report_date
          - name: state
          - name: utility_id_eia
          - name: utility_name_eia
          - name: zip_code
          - name: zip_code_4
          - name: data_maturity
