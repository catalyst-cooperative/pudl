version: 2
sources:
  - name: pudl
    tables:
      - name: core_eia861__yearly_net_metering_misc
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - data_maturity
                pk_table_name: source('pudl', 'core_pudl__codes_data_maturities')
                pk_column_names:
                  - code
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                partition_expr: EXTRACT(YEAR FROM report_date)
        columns:
          - name: balancing_authority_code_eia
          - name: pv_current_flow_type
          - name: report_date
          - name: state
          - name: utility_id_eia
          - name: data_maturity
