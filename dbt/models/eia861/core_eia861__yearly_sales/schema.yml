version: 2
sources:
  - name: pudl
    tables:
      - name: core_eia861__yearly_sales
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - data_maturity
                pk_table_name: source('pudl', 'core_pudl__codes_data_maturities')
                pk_column_names:
                  - code
          - expect_columns_not_all_null:
              arguments:
                row_conditions:
                  short_form: EXTRACT(year FROM report_date) = 2019
          - check_row_counts_per_partition:
              arguments:
                partition_expr: EXTRACT(YEAR FROM report_date)
        columns:
          - name: utility_id_eia
          - name: state
          - name: report_date
          - name: balancing_authority_code_eia
          - name: customer_class
          - name: business_model
          - name: data_observed
          - name: entity_type
          - name: service_type
          - name: short_form
          - name: utility_name_eia
          - name: customers
            data_tests:
              - dbt_expectations.expect_column_min_to_be_between:
                  arguments:
                    min_value: 0.0
                    row_condition: utility_id_eia != 99999
          - name: sales_mwh
            data_tests:
              - dbt_expectations.expect_column_min_to_be_between:
                  arguments:
                    min_value: 0.0
                    row_condition: utility_id_eia != 99999
                    error_if: ">30"
          - name: sales_revenue
            data_tests:
              - dbt_expectations.expect_column_min_to_be_between:
                  arguments:
                    min_value: 0.0
                    row_condition: utility_id_eia != 99999
                    error_if: ">300"
          - name: data_maturity
