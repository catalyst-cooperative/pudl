version: 2
sources:
  - name: pudl
    tables:
      - name: core_eia861__yearly_distributed_generation_tech
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - data_maturity
                pk_table_name: source('pudl', 'core_pudl__codes_data_maturities')
                pk_column_names:
                  - code
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                partition_expr: EXTRACT(YEAR FROM report_date)
        columns:
          - name: capacity_mw
            data_tests:
              - dbt_expectations.expect_column_min_to_be_between:
                  arguments:
                    min_value: 0.0
          - name: estimated_or_actual_tech_data
          - name: report_date
          - name: state
          - name: tech_class
          - name: utility_id_eia
          - name: data_maturity
