version: 2
sources:
  - name: pudl
    tables:
      - name: core_eia__entity_plants
        data_tests:
          - expect_columns_not_all_null
          - check_row_counts_per_partition
        columns:
          - name: plant_id_eia
          - name: plant_name_eia
          - name: city
          - name: state
          - name: state_id_fips
          - name: county
          - name: county_id_fips
            data_tests:
              - dbt_utils.not_null_proportion:
                  arguments:
                    at_least: 0.97
                  description: County fips code should almost entirely be populated.
          - name: latitude
          - name: longitude
          - name: street_address
          - name: zip_code
          - name: timezone
