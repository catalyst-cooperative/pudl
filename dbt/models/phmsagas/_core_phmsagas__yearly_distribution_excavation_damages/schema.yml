version: 2
sources:
  - name: pudl
    tables:
      - name: _core_phmsagas__yearly_distribution_excavation_damages
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - report_id
                  - report_date
                  - operator_id_phmsa
                pk_table_name: source('pudl', 'core_phmsagas__yearly_distribution_operators')
                pk_column_names:
                  - report_id
                  - report_date
                  - operator_id_phmsa
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                table_name: _core_phmsagas__yearly_distribution_excavation_damages
                partition_expr: EXTRACT(YEAR FROM report_date)
          - dbt_expectations.expect_compound_columns_to_be_unique:
              arguments:
                column_list:
                  - report_id
                  - damage_type
                  - damage_sub_type
        columns:
          - name: report_id
          - name: report_date
          - name: operator_id_phmsa
          - name: commodity
          - name: operating_state
          - name: damage_type
          - name: damage_sub_type
          - name: damages
