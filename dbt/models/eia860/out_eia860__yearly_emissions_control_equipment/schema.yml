version: 2
sources:
  - name: pudl
    tables:
      - name: out_eia860__yearly_emissions_control_equipment
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - emission_control_equipment_type_code
                pk_table_name: source('pudl', 'core_eia__codes_emission_control_equipment_types')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - operational_status_code
                pk_table_name: source('pudl', 'core_eia__codes_operational_status')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - data_maturity
                pk_table_name: source('pudl', 'core_pudl__codes_data_maturities')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_eia
                  - report_date
                pk_table_name: source('pudl', 'core_eia860__scd_plants')
                pk_column_names:
                  - plant_id_eia
                  - report_date
          - foreign_key:
              arguments:
                fk_column_names:
                  - utility_id_eia
                  - report_date
                pk_table_name: source('pudl', 'core_eia860__scd_utilities')
                pk_column_names:
                  - utility_id_eia
                  - report_date
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_pudl
                pk_table_name: source('pudl', 'core_pudl__entity_plants_pudl')
                pk_column_names:
                  - plant_id_pudl
          - foreign_key:
              arguments:
                fk_column_names:
                  - utility_id_pudl
                pk_table_name: source('pudl', 'core_pudl__entity_utilities_pudl')
                pk_column_names:
                  - utility_id_pudl
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                partition_expr: EXTRACT(YEAR FROM report_date)
        columns:
          - name: report_date
          - name: plant_id_eia
          - name: plant_id_pudl
          - name: plant_name_eia
          - name: utility_id_eia
          - name: utility_id_pudl
          - name: utility_name_eia
          - name: emission_control_id_pudl
          - name: data_maturity
          - name: emission_control_equipment_type_code
          - name: operational_status_code
          - name: operational_status
          - name: mercury_control_id_eia
          - name: nox_control_id_eia
          - name: particulate_control_id_eia
          - name: so2_control_id_eia
          - name: acid_gas_control
          - name: emission_control_equipment_cost
          - name: emission_control_operating_date
          - name: emission_control_retirement_date
