version: 2
sources:
  - name: pudl
    tables:
      - name: out_eia860__yearly_ownership
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - data_maturity
                pk_table_name: source('pudl', 'core_pudl__codes_data_maturities')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_eia
                  - generator_id
                  - report_date
                pk_table_name: source('pudl', 'core_eia860__scd_generators')
                pk_column_names:
                  - plant_id_eia
                  - generator_id
                  - report_date
          - foreign_key:
              arguments:
                fk_column_names:
                  - owner_utility_id_eia
                  - report_date
                pk_table_name: source('pudl', 'core_eia860__scd_utilities')
                pk_column_names:
                  - utility_id_eia
                  - report_date
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_pudl
                pk_table_name: source('pudl', 'core_pudl__entity_plants_pudl')
                pk_column_names:
                  - plant_id_pudl
          - foreign_key:
              arguments:
                fk_column_names:
                  - utility_id_pudl
                pk_table_name: source('pudl', 'core_pudl__entity_utilities_pudl')
                pk_column_names:
                  - utility_id_pudl
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                table_name: out_eia860__yearly_ownership
                partition_expr: EXTRACT(YEAR FROM report_date)
          - expect_date_frequency_ratio:
              arguments:
                compare_model: source("pudl", "out_eia__yearly_generators")
                multiplier: 1
                date_column: report_date
          - expect_complete_valid_ownership:
              arguments:
                n_acceptable_failures: 7
          - expect_unique_utility_id_eia
        columns:
          - name: report_date
          - name: plant_id_eia
          - name: plant_id_pudl
          - name: plant_name_eia
          - name: owner_utility_id_eia
          - name: operator_utility_id_eia
          - name: utility_id_pudl
          - name: owner_utility_name_eia
          - name: generator_id
          - name: owner_state
          - name: owner_city
          - name: owner_country
          - name: owner_street_address
          - name: owner_zip_code
          - name: fraction_owned
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
                    max_value: 1.0
          - name: data_maturity
