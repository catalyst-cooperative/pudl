version: 2
sources:
  - name: pudl
    tables:
      - name: core_eia860__scd_generators_wind
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - wind_quality_class
                pk_table_name: source('pudl', 'core_eia__codes_wind_quality_class')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_eia
                  - generator_id
                  - report_date
                pk_table_name: source('pudl', 'core_eia860__scd_generators')
                pk_column_names:
                  - plant_id_eia
                  - generator_id
                  - report_date
          - expect_columns_not_all_null:
              arguments:
                row_conditions:
                  obstacle_id_faa: EXTRACT(year FROM report_date) <= 2015
          - check_row_counts_per_partition:
              arguments:
                table_name: core_eia860__scd_generators_wind
                partition_expr: EXTRACT(YEAR FROM report_date)
        columns:
          - name: plant_id_eia
          - name: generator_id
          - name: report_date
          - name: design_wind_speed_mph
          - name: obstacle_id_faa
          - name: predominant_turbine_manufacturer
          - name: predominant_turbine_model
          - name: turbine_hub_height_feet
          - name: wind_quality_class
