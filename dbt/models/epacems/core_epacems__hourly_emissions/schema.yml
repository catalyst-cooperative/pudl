version: 2
sources:
  - name: pudl
    tables:
      - name: core_epacems__hourly_emissions
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_eia
                pk_table_name: source('pudl', 'core_eia__entity_plants')
                pk_column_names:
                  - plant_id_eia
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                partition_expr: year
          - relationships:
              arguments:
                column_name: cast(plant_id_eia as varchar) || '_' || emissions_unit_id_epa
                to: source('pudl', 'core_epa__assn_eia_epacamd_subplant_ids')
                field: cast(plant_id_eia as varchar) || '_' || emissions_unit_id_epa
              description: |-
                Every EPA CAMD unit that ever reports to CEMS should show up somewhere in the EPA/EIA
                subplant crosswalk, even units that never match an EIA generator -- the small share of
                EPA CAMD records that never get a generator_id, tracked by
                core_epa__assn_eia_epacamd_subplant_ids's not_null_proportion test on generator_id --
                via the outer merge in pudl.dagster.assets.core.glue.augment_crosswalk_with_epacamd_ids.
                relationships checks the reverse direction from usual here (this table's keys covered
                *by* the crosswalk, rather than the crosswalk's keys covered by this table), so it's
                declared here rather than on the crosswalk itself. Mirrors
                test_every_epa_emissions_unit_appears_with_a_subplant_id in
                tests/unit/transform/glue_test.py.
        columns:
          - name: plant_id_eia
          - name: plant_id_epa
          - name: emissions_unit_id_epa
          - name: operating_datetime_utc
          - name: year
          - name: state
          - name: operating_time_hours
          - name: gross_load_mw
          - name: heat_content_mmbtu
          - name: steam_load_lbs
          - name: so2_mass_lbs
          - name: so2_mass_measurement_code
          - name: nox_mass_lbs
          - name: nox_mass_measurement_code
          - name: co2_mass_tons
          - name: co2_mass_measurement_code
models:
  - name: validate_epacems__hourly_emissions_unmatched_units
    description: |-
      One row per (year, plant_id_eia, emissions_unit_id_epa) unit reporting to CEMS in a
      given year, with matched_plant_id_eia non-null iff that unit found a matching non-null
      generator_id in the EPA/EIA subplant crosswalk. Exists so per-year match-rate thresholds
      can be checked below with a plain dbt_utils.not_null_proportion test.
    columns:
      - name: year
      - name: plant_id_eia
      - name: emissions_unit_id_epa
      - name: matched_plant_id_eia
        description: |-
          Non-null iff the unit found a matching non-null generator_id in the EPA/EIA subplant
          crosswalk. Tested below with one dbt_utils.not_null_proportion test per CEMS reporting
          year, each with its own threshold, so a regression confined to a single year isn't
          diluted away by all the other years and can be debugged quickly. Matched non-null
          fractions were calculated 2026-08-30 and test thresholds set 0.5% below the measured
          value for each year; revisit when this table is next reprocessed with a new year of
          data. Tests pass when there is no data for the given year, as is mostly the case in the
          fast ETL.
        data_tests:
          - dbt_utils.not_null_proportion:
              name: not_null_proportion_matched_plant_id_eia_1995
              config:
                where: year = 1995
              arguments:
                at_least: 0.9122
          - dbt_utils.not_null_proportion:
              name: not_null_proportion_matched_plant_id_eia_1996
              config:
                where: year = 1996
              arguments:
                at_least: 0.9063
          - dbt_utils.not_null_proportion:
              name: not_null_proportion_matched_plant_id_eia_1997
              config:
                where: year = 1997
              arguments:
                at_least: 0.8871
          - dbt_utils.not_null_proportion:
              name: not_null_proportion_matched_plant_id_eia_1998
              config:
                where: year = 1998
              arguments:
                at_least: 0.8745
          - dbt_utils.not_null_proportion:
              name: not_null_proportion_matched_plant_id_eia_1999
              config:
                where: year = 1999
              arguments:
                at_least: 0.8407
          - dbt_utils.not_null_proportion:
              name: not_null_proportion_matched_plant_id_eia_2000
              config:
                where: year = 2000
              arguments:
                at_least: 0.8663
          - dbt_utils.not_null_proportion:
              name: not_null_proportion_matched_plant_id_eia_2001
              config:
                where: year = 2001
              arguments:
                at_least: 0.884
          - dbt_utils.not_null_proportion:
