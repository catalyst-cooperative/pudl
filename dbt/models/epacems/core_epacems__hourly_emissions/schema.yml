version: 2
sources:
  - name: pudl
    tables:
      - name: core_epacems__hourly_emissions
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_eia
                pk_table_name: source('pudl', 'core_eia__entity_plants')
                pk_column_names:
                  - plant_id_eia
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                table_name: core_epacems__hourly_emissions
                partition_expr: year
        columns:
          - name: plant_id_eia
          - name: plant_id_epa
          - name: emissions_unit_id_epa
          - name: operating_datetime_utc
          - name: year
          - name: state
          - name: operating_time_hours
          - name: gross_load_mw
          - name: heat_content_mmbtu
          - name: steam_load_lbs
          - name: so2_mass_lbs
          - name: so2_mass_measurement_code
          - name: nox_mass_lbs
          - name: nox_mass_measurement_code
          - name: co2_mass_tons
          - name: co2_mass_measurement_code
