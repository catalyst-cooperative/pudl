version: 2
sources:
  - name: pudl
    tables:
      - name: out_epacems__yearly_operational_characteristics
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_eia
                pk_table_name: source('pudl', 'core_eia__entity_plants')
                pk_column_names:
                  - plant_id_eia
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                partition_expr: report_year
        columns:
          - name: report_year
          - name: plant_id_epa
          - name: emissions_unit_id_epa
          - name: plant_id_eia
          - name: state
          - name: max_gross_load_mw
          - name: min_stable_load_factor
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
                    max_value: 1.0
          - name: min_up_time_hours
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  description: |-
                    min_up_time_hours is the minimum observed run length for a unit. Under etl-fast (a
                    single EPA CEMS quarter instead of the 12 trailing quarters used in production), that
                    minimum is drawn from a much smaller sample of up/down events, so it's a far noisier
                    statistic and routinely falls outside this range. Disabled for etl-fast rather than
                    loosened, since there's no principled single-quarter outlier count to pick.
                  arguments:
                    min_value: 1.0
                    max_value: 12000
                  config:
                    enabled: "{{ target.name == 'etl-full' }}"
          - name: min_down_time_hours
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  description: |-
                    Same reasoning as min_up_time_hours above: this is a minimum-of-a-small-sample statistic
                    that's too noisy to check meaningfully against etl-fast's single quarter of EPA CEMS
                    data.
                  arguments:
                    min_value: 1.0
                    max_value: 26304
                  config:
                    enabled: "{{ target.name == 'etl-full' }}"
          - name: heat_rate_at_max_load_factor_mmbtu_per_mwh
