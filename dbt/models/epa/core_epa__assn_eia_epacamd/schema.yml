version: 2
sources:
  - name: pudl
    tables:
      - name: core_epa__assn_eia_epacamd
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_eia
                  - boiler_id
                pk_table_name: source('pudl', 'core_eia__entity_boilers')
                pk_column_names:
                  - plant_id_eia
                  - boiler_id
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_eia
                  - generator_id
                pk_table_name: source('pudl', 'core_eia__entity_generators')
                pk_column_names:
                  - plant_id_eia
                  - generator_id
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                partition_expr: report_year
          - dbt_expectations.expect_compound_columns_to_be_unique:
              arguments:
                column_list:
                  - report_year
                  - plant_id_eia
                  - plant_id_epa
                  - emissions_unit_id_epa
                  - generator_id
                description: |-
                  Within a report_year, the same (plant_id_eia, plant_id_epa, emissions_unit_id_epa,
                  generator_id) association sometimes appears more than once, differing only in EPA's own
                  generator_id_epa/boiler_id naming. pudl.dagster.assets.core.glue.make_subplant_ids
                  explicitly deduplicates on this basis before building its graph, so a small, stable
                  number of these isn't a correctness problem downstream, and this test only fails if the
                  count grows. There were 65 such duplicate groups as of 2026-08-30.
              config:
                error_if: ">65"
        columns:
          - name: report_year
          - name: plant_id_epa
          - name: emissions_unit_id_epa
          - name: generator_id_epa
          - name: plant_id_eia
          - name: boiler_id
          - name: generator_id
