version: 2
sources:
  - name: pudl
    tables:
      - name: core_rus12__yearly_investments
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - investment_type_code
                pk_table_name: source('pudl', 'core_rus__codes_investment_types')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - borrower_id_rus
                pk_table_name: source('pudl', 'core_rus12__entity_borrowers')
                pk_column_names:
                  - borrower_id_rus
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                partition_expr: EXTRACT(YEAR FROM report_date)
        columns:
          - name: report_date
          - name: borrower_id_rus
          - name: investment_description
          - name: investment_type_code
          - name: included_investments
          - name: excluded_investments
          - name: income_or_loss
          - name: for_rural_development
