version: 2
sources:
  - name: pudl
    tables:
      - name: out_rus7__yearly_balance_sheet_liabilities
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - borrower_id_rus
                pk_table_name: source('pudl', 'core_rus7__entity_borrowers')
                pk_column_names:
                  - borrower_id_rus
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                partition_expr: EXTRACT(YEAR FROM report_date)
        columns:
          - name: report_date
          - name: borrower_id_rus
          - name: borrower_name_rus
          - name: state
          - name: liability_type
          - name: ending_balance
          - name: is_total
