version: 2
sources:
  - name: pudl
    tables:
      - name: out_rus7__yearly_distribution_services
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - borrower_id_rus
                pk_table_name: source('pudl', 'core_rus7__entity_borrowers')
                pk_column_names:
                  - borrower_id_rus
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                partition_expr: EXTRACT(YEAR FROM report_date)
        columns:
          - name: report_date
          - name: borrower_id_rus
          - name: borrower_name_rus
          - name: state
          - name: service_status
          - name: services
            data_tests:
              - dbt_expectations.expect_column_min_to_be_between:
                  arguments:
                    min_value: 0.0
                  config:
                    error_if: ">3"
