version: 2
sources:
  - name: ferceqr
    tables:
      - name: core_ferceqr__contracts
        data_tests:
          - expect_columns_not_all_null
          - expect_column_fraction_outside_range:
              arguments:
                column_name: CAST(contract_termination_date < commencement_date_of_contract_term AS INTEGER)
                min_value: 0
                max_value: 0
                max_fraction_above: 0.015
          - expect_column_fraction_outside_range:
              arguments:
                column_name: CAST(actual_termination_date < commencement_date_of_contract_term AS INTEGER)
                min_value: 0
                max_value: 0
                max_fraction_above: 0.02
          - expect_column_fraction_outside_range:
              arguments:
                column_name: CAST(actual_termination_date > LAST_DAY(MAKE_DATE(CAST(LEFT(year_quarter, 4) AS INTEGER), CAST(RIGHT(year_quarter, 1) AS INTEGER) * 3, 1)) AS INTEGER)
                min_value: 0
                max_value: 0
                max_fraction_above: 0.001
          - expect_column_fraction_outside_range:
              arguments:
                column_name: CAST(end_date < begin_date AS INTEGER)
                min_value: 0
                max_value: 0
                max_fraction_above: 0.01
          - expect_column_fraction_outside_range:
              arguments:
                column_name: contract_execution_date - LAST_DAY(MAKE_DATE(CAST(LEFT(year_quarter, 4) AS INTEGER), CAST(RIGHT(year_quarter, 1) AS INTEGER) * 3, 1))
                min_value: -25000
                max_value: 0
                max_fraction_below: 0.002
                max_fraction_above: 0.01
          - expect_column_fraction_outside_range:
              arguments:
                column_name: CAST(rate_units LIKE '%KWH' OR rate_units LIKE '%MWH' AS INTEGER)
                min_value: 0
                max_value: 0
                max_fraction_above: 0.001
                row_condition: product_name = 'CAPACITY' AND rate_units IS NOT NULL
          - expect_column_fraction_outside_range:
              arguments:
                column_name: CAST(rate_units LIKE '%-MO' OR rate_units LIKE '%-DAY' OR rate_units LIKE '%-WK' OR rate_units LIKE '%-YR' OR rate_units IN ('$/KW', '$/MW', '$/KVA', '$/KV', '$/KVR', '$/RKVA') AS INTEGER)
                min_value: 0
                max_value: 0
                max_fraction_above: 0.02
                row_condition: product_name = 'ENERGY' AND rate_units IS NOT NULL
          - expect_column_fraction_outside_range:
              arguments:
                column_name: CAST(rate_units LIKE '%-MO' OR rate_units LIKE '%-DAY' OR rate_units LIKE '%-WK' OR rate_units LIKE '%-YR' OR rate_units IN ('$/KW', '$/MW', '$/KVA', '$/KV', '$/KVR', '$/RKVA') AS INTEGER)
                min_value: 0
                max_value: 0
                max_fraction_above: 0.03
                row_condition: product_name = 'ENERGY IMBALANCE' AND rate_units IS NOT NULL
        columns:
          - name: year_quarter
          - name: seller_company_id_ferc
          - name: contract_unique_id
          - name: seller_company_name
          - name: customer_company_name
          - name: contract_affiliate
          - name: ferc_tariff_reference
          - name: contract_service_agreement_id
          - name: contract_execution_date
          - name: commencement_date_of_contract_term
          - name: contract_termination_date
          - name: actual_termination_date
          - name: extension_provision_description
          - name: class_name
          - name: term_name
          - name: increment_name
          - name: increment_peaking_name
          - name: product_type_name
          - name: product_name
          - name: quantity
          - name: units
          - name: rate
          - name: rate_minimum
          - name: rate_maximum
          - name: rate_description
          - name: rate_units
          - name: point_of_receipt_balancing_authority
          - name: point_of_receipt_specific_location
          - name: point_of_delivery_balancing_authority
          - name: point_of_delivery_specific_location
          - name: begin_date
          - name: end_date
