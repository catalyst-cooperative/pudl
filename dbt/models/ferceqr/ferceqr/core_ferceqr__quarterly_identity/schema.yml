version: 2
sources:
  - name: ferceqr
    tables:
      - name: core_ferceqr__quarterly_identity
        data_tests:
          - expect_columns_not_all_null
          - foreign_key:
              arguments:
                fk_column_names:
                  - year_quarter
                  - company_id_ferc
                pk_table_name: source('ferceqr', 'core_ferceqr__quarterly_index_pub')
                pk_column_names:
                  - year_quarter
                  - company_id_ferc
                row_condition: transactions_reported_to_index_price_publishers
                max_fraction: 0.1
        columns:
          - name: year_quarter
          - name: company_id_ferc
          - name: filer_unique_id
          - name: company_name
          - name: contact_name
          - name: contact_title
          - name: contact_address
          - name: contact_city
          - name: contact_state
          - name: contact_zip
          - name: contact_country_name
          - name: contact_phone
          - name: contact_email
          - name: transactions_reported_to_index_price_publishers
