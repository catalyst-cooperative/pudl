version: 2
sources:
  - name: ferceqr
    tables:
      - name: core_ferceqr__transactions
        data_tests:
          - expect_columns_not_all_null
          - expect_column_fraction_outside_range:
              arguments:
                column_name: total_transaction_charge - (transaction_quantity * price + COALESCE(total_transmission_charge, 0))
                min_value: -1
                max_value: 1
                max_fraction_below: 0.002
                max_fraction_above: 0.002
        columns:
          - name: year_quarter
          - name: seller_company_id_ferc
          - name: transaction_unique_id
          - name: seller_company_name
          - name: customer_company_name
          - name: ferc_tariff_reference
          - name: contract_service_agreement_id
          - name: seller_transaction_id
          - name: transaction_begin_date
          - name: transaction_end_date
          - name: trade_date
          - name: exchange_brokerage_service
          - name: type_of_rate
          - name: timezone
          - name: class_name
          - name: term_name
          - name: increment_name
          - name: increment_peaking_name
          - name: product_name
          - name: rate_units
          - name: point_of_delivery_balancing_authority
          - name: point_of_delivery_specific_location
          - name: transaction_quantity
          - name: price
          - name: standardized_quantity
          - name: standardized_price
          - name: total_transmission_charge
          - name: total_transaction_charge
