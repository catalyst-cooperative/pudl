                pk_table_name: source('pudl', 'core_pudl__entity_utilities_pudl')
                pk_column_names:
                  - utility_id_pudl
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                table_name: out_eia923__yearly_energy_storage
                partition_expr: EXTRACT(YEAR FROM report_date)
        columns:
          - name: report_date
          - name: plant_id_eia
          - name: plant_id_pudl
          - name: plant_name_eia
          - name: utility_id_eia
          - name: utility_id_pudl
          - name: utility_name_eia
          - name: prime_mover_code
          - name: energy_source_code
          - name: fuel_units
          - name: fuel_consumed_for_electricity_units
