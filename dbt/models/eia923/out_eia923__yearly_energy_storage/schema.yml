                  - data_maturity
                pk_table_name: source('pudl', 'core_pudl__codes_data_maturities')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - energy_source_code
                pk_table_name: source('pudl', 'core_eia__codes_energy_sources')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - prime_mover_code
                pk_table_name: source('pudl', 'core_eia__codes_prime_movers')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_eia
                  - report_date
                pk_table_name: source('pudl', 'core_eia860__scd_plants')
                pk_column_names:
                  - plant_id_eia
                  - report_date
          - foreign_key:
              arguments:
                fk_column_names:
                  - utility_id_eia
                  - report_date
                pk_table_name: source('pudl', 'core_eia860__scd_utilities')
                pk_column_names:
                  - utility_id_eia
                  - report_date
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_pudl
                pk_table_name: source('pudl', 'core_pudl__entity_plants_pudl')
                pk_column_names:
