version: 2
sources:
  - name: pudl
    tables:
      - name: out_eia923__generation_fuel_combined
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - data_maturity
                pk_table_name: source('pudl', 'core_pudl__codes_data_maturities')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - energy_source_code
                pk_table_name: source('pudl', 'core_eia__codes_energy_sources')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - fuel_type_code_agg
                pk_table_name: source('pudl', 'core_eia__codes_fuel_types_agg')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_eia
                pk_table_name: source('pudl', 'core_eia__entity_plants')
                pk_column_names:
                  - plant_id_eia
          - foreign_key:
              arguments:
                fk_column_names:
                  - prime_mover_code
                pk_table_name: source('pudl', 'core_eia__codes_prime_movers')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - utility_id_eia
                pk_table_name: source('pudl', 'core_eia__entity_utilities')
                pk_column_names:
                  - utility_id_eia
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_pudl
                pk_table_name: source('pudl', 'core_pudl__entity_plants_pudl')
                pk_column_names:
                  - plant_id_pudl
          - foreign_key:
              arguments:
                fk_column_names:
                  - utility_id_pudl
                pk_table_name: source('pudl', 'core_pudl__entity_utilities_pudl')
                pk_column_names:
                  - utility_id_pudl
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                table_name: out_eia923__generation_fuel_combined
                partition_expr: EXTRACT(YEAR FROM report_date)
        columns:
          - name: report_date
          - name: plant_id_eia
          - name: plant_id_pudl
          - name: plant_name_eia
          - name: utility_id_eia
          - name: utility_id_pudl
          - name: utility_name_eia
          - name: energy_source_code
          - name: fuel_type_code_pudl
          - name: fuel_type_code_agg
          - name: prime_mover_code
          - name: fuel_consumed_units
          - name: fuel_consumed_for_electricity_units
          - name: fuel_mmbtu_per_unit
            data_tests:
              - expect_quantile_constraints:
                  description: |-
                    The Generation Fuel table does not break different coal types out separately, so we can
                    only test the validity of the entire suite of coal records.
                  arguments:
                    row_condition: fuel_type_code_pudl='coal'
                    constraints:
                      - quantile: 0.5
                        min_value: 10.0
                        max_value: 30.0
                    weight_column: fuel_consumed_units
              - expect_quantile_constraints:
                  description: Quantile 0.05 dropped from 5.5 to 5.49 April 2025; keep an eye on it.
                  arguments:
                    row_condition: fuel_type_code_agg='DFO'
                    constraints:
                      - quantile: 0.05
                        min_value: 5.4
                      - quantile: 0.95
                        max_value: 6.0
                      - quantile: 0.5
                        min_value: 5.75
                        max_value: 5.85
                    weight_column: fuel_consumed_units
              - expect_quantile_constraints:
                  description: Quantile 0.05 dropped from 5.0 to 4.79 April 2025; keep an eye on it.
                  arguments:
                    row_condition: fuel_type_code_pudl='oil'
                    constraints:
                      - quantile: 0.05
                        min_value: 4.7
                      - quantile: 0.95
                        max_value: 6.6
                    weight_column: fuel_consumed_units
          - name: fuel_consumed_mmbtu
          - name: fuel_consumed_for_electricity_mmbtu
          - name: net_generation_mwh
          - name: data_maturity
