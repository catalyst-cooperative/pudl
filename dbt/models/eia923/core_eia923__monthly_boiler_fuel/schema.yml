version: 2
sources:
  - name: pudl
    tables:
      - name: core_eia923__monthly_boiler_fuel
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_eia
                  - boiler_id
                pk_table_name: source('pudl', 'core_eia__entity_boilers')
                pk_column_names:
                  - plant_id_eia
                  - boiler_id
          - foreign_key:
              arguments:
                fk_column_names:
                  - data_maturity
                pk_table_name: source('pudl', 'core_pudl__codes_data_maturities')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - energy_source_code
                pk_table_name: source('pudl', 'core_eia__codes_energy_sources')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - prime_mover_code
                pk_table_name: source('pudl', 'core_eia__codes_prime_movers')
                pk_column_names:
                  - code
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                table_name: core_eia923__monthly_boiler_fuel
                partition_expr: EXTRACT(YEAR FROM report_date)
        columns:
          - name: plant_id_eia
          - name: boiler_id
          - name: energy_source_code
          - name: prime_mover_code
          - name: fuel_type_code_pudl
          - name: report_date
          - name: fuel_consumed_units
          - name: fuel_mmbtu_per_unit
          - name: sulfur_content_pct
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0
                    max_value: 100
          - name: ash_content_pct
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0
                    max_value: 100
          - name: data_maturity
