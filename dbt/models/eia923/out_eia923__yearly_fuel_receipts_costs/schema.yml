version: 2
sources:
  - name: pudl
    tables:
      - name: out_eia923__yearly_fuel_receipts_costs
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - data_maturity
                pk_table_name: source('pudl', 'core_pudl__codes_data_maturities')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_eia
                  - report_date
                pk_table_name: source('pudl', 'core_eia860__scd_plants')
                pk_column_names:
                  - plant_id_eia
                  - report_date
          - foreign_key:
              arguments:
                fk_column_names:
                  - utility_id_eia
                  - report_date
                pk_table_name: source('pudl', 'core_eia860__scd_utilities')
                pk_column_names:
                  - utility_id_eia
                  - report_date
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_pudl
                pk_table_name: source('pudl', 'core_pudl__entity_plants_pudl')
                pk_column_names:
                  - plant_id_pudl
          - foreign_key:
              arguments:
                fk_column_names:
                  - utility_id_pudl
                pk_table_name: source('pudl', 'core_pudl__entity_utilities_pudl')
                pk_column_names:
                  - utility_id_pudl
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                partition_expr: EXTRACT(YEAR FROM report_date)
        columns:
          - name: report_date
          - name: plant_id_eia
          - name: plant_id_pudl
          - name: plant_name_eia
          - name: utility_id_eia
          - name: utility_id_pudl
          - name: utility_name_eia
          - name: state
          - name: fuel_type_code_pudl
          - name: fuel_received_units
          - name: fuel_mmbtu_per_unit
          - name: fuel_cost_per_mmbtu
          - name: fuel_received_mmbtu
          - name: total_fuel_cost
          - name: fuel_cost_per_mmbtu_source
          - name: sulfur_content_pct
          - name: ash_content_pct
          - name: mercury_content_ppm
          - name: moisture_content_pct
          - name: chlorine_content_ppm
          - name: data_maturity
