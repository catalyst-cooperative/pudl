version: 2
sources:
  - name: pudl
    tables:
      - name: core_eia923__monthly_generation
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - data_maturity
                pk_table_name: source('pudl', 'core_pudl__codes_data_maturities')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_eia
                  - generator_id
                pk_table_name: source('pudl', 'core_eia__entity_generators')
                pk_column_names:
                  - plant_id_eia
                  - generator_id
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                partition_expr: EXTRACT(YEAR FROM report_date)
        columns:
          - name: plant_id_eia
          - name: generator_id
          - name: report_date
          - name: net_generation_mwh
          - name: data_maturity
