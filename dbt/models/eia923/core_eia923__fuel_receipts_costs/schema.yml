version: 2
sources:
  - name: pudl
    tables:
      - name: core_eia923__fuel_receipts_costs
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - contract_type_code
                pk_table_name: source('pudl', 'core_eia__codes_contract_types')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - data_maturity
                pk_table_name: source('pudl', 'core_pudl__codes_data_maturities')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - energy_source_code
                pk_table_name: source('pudl', 'core_eia__codes_energy_sources')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - primary_transportation_mode_code
                pk_table_name: source('pudl', 'core_eia__codes_fuel_transportation_modes')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - secondary_transportation_mode_code
                pk_table_name: source('pudl', 'core_eia__codes_fuel_transportation_modes')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_eia
                pk_table_name: source('pudl', 'core_eia__entity_plants')
                pk_column_names:
                  - plant_id_eia
          - foreign_key:
              arguments:
                fk_column_names:
                  - mine_id_pudl
                pk_table_name: source('pudl', 'core_eia923__entity_coalmine')
                pk_column_names:
                  - mine_id_pudl
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                partition_expr: EXTRACT(YEAR FROM report_date)
        columns:
          - name: plant_id_eia
          - name: report_date
          - name: contract_type_code
          - name: contract_expiration_date
          - name: energy_source_code
          - name: fuel_type_code_pudl
          - name: fuel_group_code
          - name: mine_id_pudl
          - name: supplier_name
          - name: fuel_received_units
          - name: fuel_mmbtu_per_unit
          - name: sulfur_content_pct
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0
                    max_value: 100
          - name: ash_content_pct
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0
                    max_value: 100
          - name: mercury_content_ppm
          - name: fuel_cost_per_mmbtu
          - name: primary_transportation_mode_code
          - name: secondary_transportation_mode_code
          - name: natural_gas_transport_code
          - name: natural_gas_delivery_contract_type_code
          - name: moisture_content_pct
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0
                    max_value: 100
                  config:
                    error_if: ">12"
                  description: |-
                    12 coal receipts from plant 10860 in 2015 report moisture content of 247%, which is
                    physically impossible and appears to be a data entry error in the EIA-923 source data.
          - name: chlorine_content_ppm
          - name: data_maturity
