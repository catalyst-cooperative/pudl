version: 2
sources:
  - name: pudl
    tables:
      - name: _core_eia923__yearly_emissions_control
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - data_maturity
                pk_table_name: source('pudl', 'core_pudl__codes_data_maturities')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_eia
                pk_table_name: source('pudl', 'core_eia__entity_plants')
                pk_column_names:
                  - plant_id_eia
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                partition_expr: EXTRACT(YEAR FROM report_date)
        columns:
          - name: plant_id_eia
          - name: report_date
          - name: acid_gas_removal_efficiency
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
                    max_value: 1.0
          - name: annual_nox_emission_rate_lb_per_mmbtu
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
          - name: data_maturity
          - name: environmental_equipment_name
          - name: fgd_electricity_consumption_mwh
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
          - name: fgd_sorbent_consumption_tons
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
          - name: hours_in_service
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
          - name: mercury_control_id_eia
          - name: mercury_emission_rate_lb_per_trillion_btu
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
          - name: mercury_removal_efficiency
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
                    max_value: 1.0
          - name: nox_control_id_eia
          - name: operational_status
          - name: ozone_season_nox_emission_rate_lb_per_mmbtu
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
          - name: particulate_control_id_eia
          - name: particulate_emission_rate_lb_per_mmbtu
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
          - name: particulate_removal_efficiency_tested
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
                    max_value: 1.0
          - name: particulate_removal_efficiency_annual
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
                    max_value: 1.0
                    warn_if: ">0"
                    error_if: ">67"
          - name: particulate_test_date
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: DATE '1950-01-01'
                    max_value: current_date
          - name: so2_control_id_eia
          - name: so2_removal_efficiency_tested
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
                    max_value: 1.0
          - name: so2_removal_efficiency_annual
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
                    max_value: 1.0
          - name: so2_test_date
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: DATE '1975-01-01'
                    max_value: current_date
