version: 2
sources:
  - name: pudl
    tables:
      - name: out_eia923__monthly_generation_fuel_combined
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - data_maturity
                pk_table_name: source('pudl', 'core_pudl__codes_data_maturities')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - energy_source_code
                pk_table_name: source('pudl', 'core_eia__codes_energy_sources')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_eia
                pk_table_name: source('pudl', 'core_eia__entity_plants')
                pk_column_names:
                  - plant_id_eia
          - foreign_key:
              arguments:
                fk_column_names:
                  - prime_mover_code
                pk_table_name: source('pudl', 'core_eia__codes_prime_movers')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - utility_id_eia
                pk_table_name: source('pudl', 'core_eia__entity_utilities')
                pk_column_names:
                  - utility_id_eia
          - foreign_key:
              arguments:
                fk_column_names:
                  - plant_id_pudl
                pk_table_name: source('pudl', 'core_pudl__entity_plants_pudl')
                pk_column_names:
                  - plant_id_pudl
          - foreign_key:
              arguments:
                fk_column_names:
                  - utility_id_pudl
                pk_table_name: source('pudl', 'core_pudl__entity_utilities_pudl')
                pk_column_names:
                  - utility_id_pudl
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                table_name: out_eia923__monthly_generation_fuel_combined
                partition_expr: EXTRACT(YEAR FROM report_date)
          - expect_date_frequency_ratio:
              arguments:
                compare_model: source("pudl", "out_eia__yearly_generators")
                multiplier: 12
                date_column: report_date
          - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
              arguments:
                column_A: fuel_consumed_mmbtu
                column_B: fuel_consumed_for_electricity_mmbtu
                or_equal: true
        columns:
          - name: report_date
          - name: plant_id_eia
          - name: plant_id_pudl
          - name: plant_name_eia
          - name: utility_id_eia
          - name: utility_id_pudl
          - name: utility_name_eia
          - name: energy_source_code
          - name: fuel_type_code_pudl
          - name: prime_mover_code
          - name: fuel_consumed_units
          - name: fuel_consumed_for_electricity_units
          - name: fuel_mmbtu_per_unit
          - name: fuel_consumed_mmbtu
          - name: fuel_consumed_for_electricity_mmbtu
          - name: net_generation_mwh
            data_tests:
              - expect_column_fraction_with_condition:
                  arguments:
                    numerator_row_condition: fuel_type_code_pudl='nuclear'
                    min_fraction: 0.18
                    max_fraction: 0.22
              - expect_column_fraction_with_condition:
                  arguments:
                    numerator_row_condition: fuel_type_code_pudl='coal'
                    min_fraction: 0.15
                    max_fraction: 0.4
              - expect_column_fraction_with_condition:
                  arguments:
                    numerator_row_condition: fuel_type_code_pudl='gas'
                    min_fraction: 0.25
                    max_fraction: 0.5
              - expect_column_fraction_with_condition:
                  arguments:
                    numerator_row_condition: fuel_type_code_pudl='hydro'
                    min_fraction: 0.04
                    max_fraction: 0.1
              - expect_column_fraction_with_condition:
                  arguments:
                    numerator_row_condition: fuel_type_code_pudl='wind'
                    min_fraction: 0.04
                    max_fraction: 0.15
              - expect_column_fraction_with_condition:
                  arguments:
                    numerator_row_condition: fuel_type_code_pudl='solar'
                    min_fraction: 0.0
                    max_fraction: 0.1
          - name: data_maturity
