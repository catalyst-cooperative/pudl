version: 2
sources:
  - name: pudl
    tables:
      - name: core_ferc1__yearly_purchased_power_and_exchanges_sched326
        data_tests:
          - foreign_key:
              arguments:
                fk_column_names:
                  - purchase_type_code
                pk_table_name: source('pudl', 'core_ferc1__codes_power_purchase_types')
                pk_column_names:
                  - code
          - foreign_key:
              arguments:
                fk_column_names:
                  - utility_id_ferc1
                pk_table_name: source('pudl', 'core_pudl__assn_ferc1_pudl_utilities')
                pk_column_names:
                  - utility_id_ferc1
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                partition_expr: report_year
        columns:
          - name: record_id
          - name: utility_id_ferc1
          - name: report_year
          - name: seller_name
          - name: purchase_type_code
          - name: tariff
          - name: billing_demand_mw
          - name: non_coincident_peak_demand_mw
          - name: coincident_peak_demand_mw
          - name: purchased_mwh
          - name: purchased_storage_mwh
          - name: purchased_other_than_storage_mwh
          - name: received_mwh
          - name: delivered_mwh
          - name: demand_charges
          - name: energy_charges
          - name: other_charges
          - name: total_settlement
