# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: "pudl_dbt"
version: "1.0.0"

# This setting configures which "profile" dbt uses for this project.
profile: "pudl_dbt"

# Opt out of telemetry
flags:
  send_anonymous_usage_stats: false
  require_generic_test_arguments_property: true

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
macro-paths: ["macros", "tests/data_tests/generic_tests"]
seed-paths: ["seeds"]
test-paths: ["tests/unit_tests"]

vars:
  pudl_parquet_base_path: "{{ env_var('PUDL_OUTPUT') ~ '/parquet' }}"
  ferceqr_parquet_base_path: "{{ env_var('PUDL_OUTPUT') ~ '/parquet' }}"

sources:
  pudl_dbt:
    +meta:
      external_location: "{{ env_var('PUDL_PARQUET_BASE_PATH', env_var('PUDL_OUTPUT') ~ '/parquet') }}/{name}.parquet"
    # This applies a separate location to all `schema.yml` files in the `dbt/models/ferceqr` directory
    # Note that this is based on the path NOT the source name in the schema file. This distinction has led to much confusion in the past
    # We do use a different source name for ferceqr, but this is to make it easy to run tests separately for these tables
    ferceqr:
      +meta:
        external_location: "{{ env_var('FERCEQR_PARQUET_BASE_PATH', env_var('PUDL_OUTPUT') ~ '/parquet') }}/{name}/**/*.parquet"
