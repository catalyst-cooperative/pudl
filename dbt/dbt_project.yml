# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: "pudl_dbt"
version: "1.0.0"

# This setting configures which "profile" dbt uses for this project.
profile: "pudl_dbt"

# Opt out of telemetry
flags:
  send_anonymous_usage_stats: false
  require_generic_test_arguments_property: true

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
macro-paths: ["macros", "tests/data_tests/generic_tests"]
seed-paths: ["seeds"]
test-paths: ["tests/unit_tests"]

# Apply `external_location` to tell dbt where parquet files are located so it can use duckdb to query them
sources:
  pudl_dbt:
    # This will apply `external_location` based on the path of a table's `schema.yml` file
    # Schema files in the `dbt/models/pudl` directory will get this path pointing to a single parquet file
    pudl:
      +meta:
        external_location: "{{ env_var('PARQUET_BASE_PATH', env_var('PUDL_OUTPUT') ~ '/parquet') }}/{name}.parquet"
    # Schema files in the `dbt/models/ferceqr` directory will get this path pointing to a directory of parquet files
    ferceqr:
      +meta:
        external_location: "{{ env_var('PARQUET_BASE_PATH', env_var('PUDL_OUTPUT') ~ '/parquet') }}/{name}/**/*.parquet"
