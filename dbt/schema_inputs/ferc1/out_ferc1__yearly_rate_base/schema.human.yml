sources:
  - name: pudl
    tables:
      - name: out_ferc1__yearly_rate_base
        data_tests:
          - check_row_counts_per_partition:
              arguments:
                partition_expr: report_year
          - expect_columns_not_all_null:
              description: ferc_account is entirely null. Seems like an error.
              config:
                severity: warn
        columns:
          - name: ending_balance
            data_tests:
              - dbt_expectations.expect_column_sum_to_be_between:
                  description: |-
                    Sum of the ending_balance by year should hold relatively constant. Tolerance is +/- $5,
                    sized to comfortably absorb float64 summation noise (observed up to ~$0.50 for sums of
                    this magnitude) while remaining far tighter than any real data or code regression.
                  arguments:
                    min_value: 1199491017899 - 5
                    max_value: 1199491017899 + 5
                    row_condition: "report_year = 2025"
              - dbt_expectations.expect_column_sum_to_be_between:
                  description: Sum of the ending_balance by year should hold relatively constant.
                  config:
                    enabled: "{{ target.name == 'etl-full' }}"
                  arguments:
                    min_value: 1114548162173 - 5
                    max_value: 1114548162173 + 5
                    row_condition: "report_year = 2024"
              - dbt_expectations.expect_column_sum_to_be_between:
                  description: Sum of the ending_balance by year should hold relatively constant.
