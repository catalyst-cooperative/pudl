version: 2
sources:
  - name: pudl
    tables:
      - name: out_epacems__yearly_operational_characteristics
        data_tests:
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                partition_expr: report_year
        columns:
          - name: min_stable_load_factor
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
                    max_value: 1.0
          - name: min_up_time_hours
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  description: |-
                    min_up_time_hours is the minimum observed run length for a unit. Under etl-fast (a
                    single EPA CEMS quarter instead of the 12 trailing quarters used in production), that
                    minimum is drawn from a much smaller sample of up/down events, so it's a far noisier
                    statistic and routinely falls outside this range. Disabled for etl-fast rather than
                    loosened, since there's no principled single-quarter outlier count to pick.
                  arguments:
                    # A min of 0.0 would not count as up time. 1.0 is lowest possible.
                    min_value: 1.0
                    # Baseload CCGTs have mandatory inspections every 8-12k hours.
                    max_value: 12000
                  config:
                    enabled: "{{ target.name == 'etl-full' }}"
          - name: min_down_time_hours
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  description: |-
                    Same reasoning as min_up_time_hours above: this is a minimum-of-a-small-sample statistic
                    that's too noisy to check meaningfully against etl-fast's single quarter of EPA CEMS
                    data.
                  arguments:
                    # A min of 0.0 would not count as down time. 1.0 is lowest possible.
                    min_value: 1.0
                    # Number of hours in 3 years. Some units never fire.
                    max_value: 26304
                  config:
                    enabled: "{{ target.name == 'etl-full' }}"
          - name: heat_rate_at_max_load_factor_mmbtu_per_mwh
            data_tests:
              # Per-unit median heat rate over each unit's single highest load-factor bin.
              # min_value is the thermodynamic-ish floor: the world's most efficient CCGT
              # runs ~5.5 MMBtu/MWh, so anything materially below 5.4 is a bad estimate.
              # max_value is 25.0 here because units are most efficient at max output.
              # The fraction of unphysically low values shrinks over time as EPA CEMS unit
              # coverage and hourly heat-input quality improve, so max_fraction_below is
              # set per report_year (~1.5x the observed rate); years not listed are
              # unchecked. High-side outliers show no trend, so max_fraction_above is a
              # single flat bound. etl-full only: under etl-fast's single quarter each
              # load-factor bin holds too few hours for the median to be stable.
              - expect_column_fraction_outside_range:
                  arguments: {
                      min_value: 5.4,
                      max_value: 25.0,
                      max_fraction_above: 0.015,
                      max_fraction_below: 0.065,
                      row_condition: "report_year = 2000",
                    } # observed 4.67%
                  config: { enabled: "{{ target.name == 'etl-full' }}" }
              - expect_column_fraction_outside_range:
