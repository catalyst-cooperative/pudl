version: 2
sources:
  - name: pudl
    tables:
      - name: out_epacems__yearly_operational_characteristics
        data_tests:
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                table_name: out_epacems__yearly_operational_characteristics
                partition_expr: report_year
        columns:
          - name: min_stable_level
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
                    max_value: 1.0
          - name: min_up_time_hours
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
                    max_value: 24.0
                  config:
                    error_if: ">24"
          - name: min_down_time_hours
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
                    max_value: 24.0
                  config:
                    error_if: ">32"
          - name: heat_rate_at_max_load_factor_mmbtu_per_mwh
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 3.0
                    max_value: 18.0
                  config:
                    error_if: ">49"
          - name: heat_rate_at_min_stable_level_mmbtu_per_mwh
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 3.0
                    max_value: 25.0
                  config:
                    error_if: ">57"
          - name: ramp_up_rate_fraction_of_max_gross_load_per_min
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
                    max_value: 0.017
          - name: ramp_down_rate_fraction_of_max_gross_load_per_min
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: -0.017
                    max_value: 0.0
