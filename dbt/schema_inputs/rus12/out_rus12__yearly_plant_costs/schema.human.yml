sources:
  - name: pudl
    tables:
      - name: out_rus12__yearly_plant_costs
        data_tests:
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                table_name: out_rus12__yearly_plant_costs
                partition_expr: EXTRACT(YEAR FROM report_date)
          - expect_columns_ratio:
              arguments:
                numerator_column: cost_per_mwh
                denominator_column: cost_per_mmbtu
                min_ratio: 3.412142
              config:
                error_if: ">96" # ~6% of the data
          # CALCULATE FUEL COST SUBTOTALS BY PLANT TYPE
          - subcomponents_sum_to_total:
              arguments:
                group_by_columns:
                  - borrower_id_rus
                  - report_date
                  - plant_name_rus
                  - plant_type
                categorical_column: cost_type
                value_column: cost
                subcomponents_list:
                  - coal_fuel
                  - oil_fuel
                  - gas_fuel
                  - other_fuel
                total_label: total_fuel
                tolerance: 10
              row_condition: plant_type == 'steam'
              description: Check that steam fuel subcomponents sum to total.
          - subcomponents_sum_to_total:
              arguments:
                group_by_columns:
                  - borrower_id_rus
                  - report_date
                  - plant_name_rus
                  - plant_type
                categorical_column: cost_type
                value_column: cost
                subcomponents_list:
                  - energy_for_compressed_air
                  - oil_fuel
                  - gas_fuel
                  - other_fuel
                total_label: total_fuel
                tolerance: 10
              row_condition: plant_type IN ('internal_combustion', 'combined_cycle')
              description: Check that IC and CC fuel subcomponents sum to total.
          - subcomponents_sum_to_total:
              arguments:
                group_by_columns:
                  - borrower_id_rus
                  - report_date
                  - plant_name_rus
                  - plant_type
                categorical_column: cost_type
                value_column: cost
                subcomponents_list:
                  - fuel
                # All reported values of this adjustment are zero so far; the
                # raw column name (lessfuelacquisitionadjustment) indicates it
                # is subtracted.
                negative_subcomponents_list:
                  - less_fuel_acquisition_adjustment
                total_label: net_fuel
                tolerance: 10
              row_condition: plant_type == 'nuclear'
              description: Check that nuclear fuel less the acquisition adjustment sums to net fuel.
          # CALCULATE NON-FUEL OPERATION COST SUBTOTALS BY PLANT TYPE
          - subcomponents_sum_to_total:
              arguments:
                group_by_columns:
                  - borrower_id_rus
                  - report_date
                  - plant_name_rus
                  - plant_type
                categorical_column: cost_type
                value_column: cost
                subcomponents_list:
                  - supervision_and_engineering
                  - steam
                  - electric
                  - steam_power
                  - allowances
                  - rents
                total_label: non_fuels_subtotal
                tolerance: 10
              row_condition: plant_type == 'steam'
              description: Check that steam non-fuel subcomponents sum to the non-fuels subtotal.
          - subcomponents_sum_to_total:
              arguments:
                group_by_columns:
                  - borrower_id_rus
                  - report_date
                  - plant_name_rus
                  - plant_type
                categorical_column: cost_type
                value_column: cost
                subcomponents_list:
                  - supervision_and_engineering
                  - generation
                  - other_generation
                  - steam
                  - electric
                  - steam_power
                  - allowances
                  - rents
                total_label: non_fuels_subtotal
                tolerance: 10
              row_condition: plant_type == 'combined_cycle'
              description: Check that CC non-fuel subcomponents sum to the non-fuels subtotal.
          - subcomponents_sum_to_total:
              arguments:
                group_by_columns:
                  - borrower_id_rus
                  - report_date
                  - plant_name_rus
                  - plant_type
                categorical_column: cost_type
                value_column: cost
                subcomponents_list:
                  - supervision_and_engineering
                  - generation
                  - other_generation
                  - rents
                total_label: non_fuels_subtotal
                tolerance: 10
              row_condition: plant_type == 'internal_combustion'
              description: Check that IC non-fuel subcomponents sum to the non-fuels subtotal.
          # CALCULATE OPERATIONS COST TOTALS BY PLANT TYPE
          - subcomponents_sum_to_total:
              arguments:
                group_by_columns:
                  - borrower_id_rus
                  - report_date
                  - plant_name_rus
                  - plant_type
                categorical_column: cost_type
                value_column: cost
                subcomponents_list:
                  - total_fuel
                  - non_fuels_subtotal
                total_label: operations_total
                tolerance: 10
              row_condition: plant_type IN ('steam', 'internal_combustion', 'combined_cycle')
              description: Check that steam, IC and CC operation subcomponents sum to total.
          - subcomponents_sum_to_total:
              arguments:
                group_by_columns:
                  - borrower_id_rus
                  - report_date
                  - plant_name_rus
                  - plant_type
                categorical_column: cost_type
                value_column: cost
                subcomponents_list:
                  - supervision_and_engineering
                  - water_for_power
                  - energy_for_pumped_storage
                  - hydraulic
                  - electric
                  - miscellaneous_power_generation
                  - rents
                total_label: operations_total
                tolerance: 10
              row_condition: plant_type == 'hydro'
              description: Check that hydro operation subcomponents sum to total.
          - subcomponents_sum_to_total:
              arguments:
                group_by_columns:
                  - borrower_id_rus
                  - report_date
                  - plant_name_rus
                  - plant_type
                categorical_column: cost_type
                value_column: cost
                subcomponents_list:
                  - supervision_and_engineering
                  - net_fuel
                  - coolants_and_water
                  - steam
                  - steam_other_sources
                  - electric
                  - other_nuclear_power
                  - rents
                total_label: operations_total
                tolerance: 10
              row_condition: plant_type == 'nuclear'
              description: Check that nuclear operation subcomponents sum to total.
          # CALCULATE MAINTENANCE COST TOTALS BY PLANT TYPE
          - subcomponents_sum_to_total:
              arguments:
                group_by_columns:
                  - borrower_id_rus
                  - report_date
                  - plant_name_rus
                  - plant_type
                categorical_column: cost_type
                value_column: cost
                subcomponents_list:
                  - maintenance_supervision_and_engineering
                  - maintenance_structures
                  - maintenance_boiler_plant
                  - maintenance_electric_plant
                  - maintenance_other_plant
                total_label: maintenance_total
                tolerance: 10
              row_condition: plant_type == 'steam'
              description: Check that steam maintenance subcomponents sum to total.
          - subcomponents_sum_to_total:
              arguments:
                group_by_columns:
                  - borrower_id_rus
                  - report_date
                  - plant_name_rus
                  - plant_type
                categorical_column: cost_type
                value_column: cost
                subcomponents_list:
                  - maintenance_supervision_and_engineering
                  - maintenance_structures
                  - maintenance_reservoirs_dams_waterways
                  - maintenance_electric_plant
                  - maintenance_miscellaneous_plant
                total_label: maintenance_total
                tolerance: 10
              row_condition: plant_type == 'hydro'
              description: Check that hydro maintenance subcomponents sum to total.
          - subcomponents_sum_to_total:
              arguments:
                group_by_columns:
                  - borrower_id_rus
                  - report_date
                  - plant_name_rus
                  - plant_type
                categorical_column: cost_type
                value_column: cost
                subcomponents_list:
                  - maintenance_supervision_and_engineering
                  - maintenance_structures
                  - maintenance_reactor_plant_equipment
                  - maintenance_electric_plant
                  - maintenance_other_plant
                total_label: maintenance_total
                tolerance: 10
              row_condition: plant_type == 'nuclear'
              description: Check that nuclear maintenance subcomponents sum to total.
          - subcomponents_sum_to_total:
              arguments:
                group_by_columns:
                  - borrower_id_rus
                  - report_date
                  - plant_name_rus
                  - plant_type
                categorical_column: cost_type
                value_column: cost
                subcomponents_list:
                  - maintenance_supervision_and_engineering
                  - maintenance_structures
                  - maintenance_generating_and_electric_plant
                  - maintenance_other_plant
                total_label: maintenance_total
                tolerance: 10
              row_condition: plant_type IN ('internal_combustion', 'combined_cycle')
              description: Check that IC and CC maintenance subcomponents sum to total.
          # CALCULATE TOTAL OPERATIONS AND MAINTENANCE COSTS
          - subcomponents_sum_to_total:
              arguments:
                group_by_columns:
                  - borrower_id_rus
                  - report_date
                  - plant_name_rus
                  - plant_type
                categorical_column: cost_type
                value_column: cost
                subcomponents_list:
                  - operations_total
                  - maintenance_total
                # reactor_credits is only reported for nuclear plants and all
                # reported values are zero so far; the form labels it a credit
                # so it is subtracted.
                negative_subcomponents_list:
                  - reactor_credits
                total_label: total
                tolerance: 10
              description: Check that operations and maintenance totals sum to total opex.
          # CALCULATE TOTAL FIXED COSTS
          - subcomponents_sum_to_total:
              arguments:
                group_by_columns:
                  - borrower_id_rus
                  - report_date
                  - plant_name_rus
                  - plant_type
                categorical_column: cost_type
                value_column: cost
                subcomponents_list:
                  - depreciation
                  - interest
                total_label: total_fixed
                tolerance: 10
              row_condition: cost_group == 'capex'
              description: Check that fixed cost subcomponents sum to total fixed costs.
          # CALCULATE TOTAL POWER COSTS ACROSS COST GROUPS
          # This calculation crosses the cost_group and cost_type columns, so
          # subcomponents are identified by (cost_group, cost_type) tuples.
          - subcomponents_sum_to_total:
              arguments:
                group_by_columns:
                  - borrower_id_rus
                  - report_date
                  - plant_name_rus
                  - plant_type
                categorical_column:
                  - cost_group
                  - cost_type
                value_column: cost
                subcomponents_list:
                  - [opex, total]
                  - [capex, total_fixed]
                # The raw column name (lessplantacquisitionadjustment)
                # indicates this nuclear-only adjustment is subtracted.
                negative_subcomponents_list:
                  - [capex, plant_acquisition_adjustment]
                total_label: [total, power]
                tolerance: 10
              description: Check that opex and fixed cost totals sum to total power costs.
        columns:
          - name: cost
            data_tests:
              - dbt_expectations.expect_column_min_to_be_between:
                  arguments:
                    min_value: 0.0
                  config:
                    error_if: ">213" # 0.4% of the data
          - name: cost_per_mwh
            data_tests:
              - dbt_expectations.expect_column_min_to_be_between:
                  arguments:
                    min_value: 0.0
                  config:
                    error_if: ">381" # 0.7% of the data
          - name: cost_per_mmbtu
            data_tests:
              - dbt_expectations.expect_column_min_to_be_between:
                  arguments:
                    min_value: 0.0
                  config:
                    error_if: ">23"
