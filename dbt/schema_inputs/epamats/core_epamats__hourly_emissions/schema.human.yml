sources:
  - name: pudl
    tables:
      - name: core_epamats__hourly_emissions
        data_tests:
          - expect_columns_not_all_null:
              description:
                "Every column should contain at least some non-null data. The HF
                columns were dropped in the transform because MATS does not require
                reporting of hydrogen fluoride (HF) emissions; if they are ever
                re-added and left empty, this test will fail.
                "
          - check_row_counts_per_partition:
              arguments:
                table_name: core_epamats__hourly_emissions
                partition_expr: year
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - plant_id_epa
                  - emissions_unit_id_epa
                  - operating_datetime_utc
              description:
                Each row is one hour of emissions for one unit at one plant, so
                (plant, unit, datetime) should uniquely identify a row.
          - expect_consistent_years:
              arguments:
                datetime_column: operating_datetime_utc
                date_column: make_date(year, 1, 1)
                max_mismatch_ratio: 0.001
              description:
                year is the local reporting year, while operating_datetime_utc is
                converted to UTC. Late-December local hours fall in January of the
                following year in UTC, so a small mismatch fraction is expected;
                the observed ratio is ~0.0007.
          - expect_one2one_mapping:
              arguments:
                groupby_column: plant_id_epa
                counted_column: plant_id_eia
                n_acceptable: 0
              description: >
                Each EPA plant should map to exactly one EIA plant via the
                core_epa__assn_eia_epacamd crosswalk.
          - expect_columns_are_close:
              arguments:
                column_a: hg_output_rate_lb_per_gwh
                column_b: hg_mass_lbs / (gross_load_mw * operating_time_hours) * 1000
                row_condition: >
                  gross_load_mw > 0 AND operating_time_hours > 0
                  AND hg_mass_lbs IS NOT NULL
                  AND hg_output_rate_lb_per_gwh IS NOT NULL
                atol: 0.0001
              description: >
                Hg output rate (lb/GWh) should equal Hg mass (lb) divided by
                generation (MW * hours), scaled by 1000. Observed max error on
                the full table: 6.7e-7. Rows where either side is missing are
                not checked: EPA reports mass and load without an output rate
                for some rows (~155k in the current data).
          - expect_columns_are_close:
              arguments:
                column_a: hg_input_rate_lb_per_tbtu
                column_b: hg_mass_lbs / heat_content_mmbtu * 1000000
                row_condition: >
                  heat_content_mmbtu > 0
                  AND hg_mass_lbs IS NOT NULL
                  AND hg_input_rate_lb_per_tbtu IS NOT NULL
                atol: 0.05
              description: >
                Hg input rate (lb/TBtu) should equal Hg mass (lb) divided by heat
                content (mmBtu), scaled by 1,000,000. Observed max error on the
                full table: 0.0045. Rows where either side is missing are not
                checked.
        columns:
          - name: gross_load_mw
            data_tests:
              - dbt_expectations.expect_column_min_to_be_between:
                  arguments:
                    min_value: 0.0
                  description: >
                    EPA reports -1 as a placeholder for unknown load values;
                    these are converted to NA in the transform, so all remaining
                    values should be non-negative.
          - name: heat_content_mmbtu
            data_tests:
              - dbt_expectations.expect_column_min_to_be_between:
                  arguments:
                    min_value: 0.0
                  config:
                    error_if: ">13"
                    warn_if: ">13"
                  description: >
                    Heat input should be non-negative, but EPA reports a small number of small
                    negative values. These are paired with negative Hg
                    mass readings, so they are retained as reported rather than
                    treated as missing. Fail if many more negative values
                    appear.
          - name: operating_time_hours
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  arguments:
                    min_value: 0.0
                    max_value: 1.0
                  config:
                    error_if: ">0"
                  description: >
                    Operating time is the fraction of the hour the unit operated,
                    so it must be between 0 and 1.
          - name: steam_load_lbs
            data_tests:
              - expect_missingness_between:
                  arguments:
                    lower_bound: 0.97
                    upper_bound: 1.0
                  description: >
                    Steam load is only reported by some units; ~97.7% of rows are
                    null in the current data.
          - name: hg_mass_measurement_code
          - name: hcl_mass_lbs
            data_tests:
              - expect_missingness_between:
                  arguments:
                    lower_bound: 0.99
                    upper_bound: 1.0
                  description: >
                    HCl emissions are rarely reported under MATS; ~99.4% of rows
                    are null in the current data.
          - name: hcl_output_rate_lb_per_mwh
            data_tests:
              - expect_missingness_between:
                  arguments:
                    lower_bound: 0.99
                    upper_bound: 1.0
                  description: >
                    HCl emissions are rarely reported under MATS; ~99.5% of rows
                    are null in the current data.
          - name: hcl_input_rate_lb_per_mmbtu
            data_tests:
              - expect_missingness_between:
                  arguments:
                    lower_bound: 0.99
                    upper_bound: 1.0
                  description: >
                    HCl emissions are rarely reported under MATS; ~99.4% of rows
                    are null in the current data.
          - name: hcl_mass_measurement_code
