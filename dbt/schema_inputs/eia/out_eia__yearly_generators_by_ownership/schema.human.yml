sources:
  - name: pudl
    tables:
      - name: out_eia__yearly_generators_by_ownership
        data_tests:
          - expect_columns_not_all_null
          - check_row_counts_per_partition:
              arguments:
                partition_expr: EXTRACT(YEAR FROM report_date)
          - dbt_expectations.expect_compound_columns_to_be_unique:
              arguments:
                column_list:
                  - plant_id_eia
                  - generator_id
                  - utility_id_eia
                  - report_date
                  - ownership_record_type
        columns:
          - name: operator_utility_id_eia
            data_tests:
              # EIA reports a single operator per generator, so every ownership slice of a
              # given generator-year should name the same operator utility. A handful of
              # generator-years have no operator at all, so the bound is "fewer than 2
              # distinct values" rather than "exactly 1" -- count(distinct) ignores nulls,
              # which makes those all-null groups count as 0 rather than failing.
              - dbt_expectations.expect_column_distinct_count_to_be_less_than:
                  arguments:
                    value: 2
                    group_by: [plant_id_eia, generator_id, report_date]
