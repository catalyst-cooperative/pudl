pudl_dbt:
  outputs:
    # Define targets for local full/fast ETL outputs
    etl-full:
      threads: 1
      type: duckdb
      path: "{{ env_var('PUDL_OUTPUT') }}/pudl_dbt_tests.duckdb"
      extensions:
        - httpfs
        - parquet
      secrets:
        - type: s3
          region: us-west-2
          url_style: path
          provider: config
    etl-fast:
      threads: 1
      type: duckdb
      path: "{{ env_var('PUDL_OUTPUT') }}/pudl_dbt_tests.duckdb"

  target: etl-full
