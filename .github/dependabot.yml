---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /builds
      - /.devcontainer
    target-branch: main
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"
