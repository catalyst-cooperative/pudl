---
name: deploy-pudl
on:
  workflow_dispatch:
    inputs:
      git_tag:
        description: "Git tag to merge into nightly/stable branch and trigger Zenodo workflow for"
        required: true
        type: string
      deployment_environment:
        type: choice
        description: "Deploy to staging or production environment?"
        required: true
        default: "staging"
        options:
          - staging
          - production

jobs:
  deploy_pudl:
    permissions:
      contents: write
      id-token: write
    name: Deploy PUDL build from GCS bucket
    runs-on: ubuntu-latest
    env:
      # This workflow is workflow_dispatch-only, so both inputs are always provided
      # (either by a human via the UI, or by pudl_batch.sh's automated dispatch).
      GIT_TAG: ${{ inputs.git_tag }}
      DEPLOYMENT_ENVIRONMENT: ${{ inputs.deployment_environment }}
      # Computed once and reused for both the container-env (so pudl_deploy can
      # link to this job's own logs) and the actual job submission below.
      BATCH_JOB_NAME: deploy-outputs-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag exists and matches expected pattern
        run: |
          TAG="${{ env.GIT_TAG }}"
          REGEX='^(v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}|nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}|branch-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}-.*-.*)$'
          if [[ ! "$TAG" =~ $REGEX ]]; then
            echo "::error::Tag '$TAG' does not look like a nightly, branch, or stable tag!"
            exit 1
          fi

          ENVIRONMENT="${{ env.DEPLOYMENT_ENVIRONMENT }}"
          if [[ "$ENVIRONMENT" != "staging" && "$ENVIRONMENT" != "production" ]]; then
            echo "::error::DEPLOYMENT_ENVIRONMENT must be 'staging' or 'production', got: '$ENVIRONMENT'"
            exit 1
          fi

          # Branch builds are only ever disposable test outputs and must never reach
          # production (mirrors DeploymentPlan's own validation on the Python side).
          if [[ "$TAG" == branch-* && "$ENVIRONMENT" == "production" ]]; then
            echo "::error::Branch deployments ('$TAG') can only target staging, not production."
            exit 1
          fi

          git fetch --tags
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag '$TAG' exists."
          else
            echo "::error::Tag '$TAG' does not exist."
            exit 1
          fi

          TAG_SHA=$(git rev-list -n 1 "$TAG")
          CURRENT_SHA="${{ github.sha }}"
          if [[ "$CURRENT_SHA" != "$TAG_SHA" ]] && [[ "$TAG" == v20* ]]; then
            echo "::error::Stable deployments must be run from the same commit that produced the build!"
            exit 1
          fi

          # Nightly and stable deployments must refer to a commit that's actually on
          # main -- branch builds are exempt, since they're only ever deployed to
          # staging and are expected to come from arbitrary feature branches.
          if [[ "$TAG" != branch-* ]]; then
            git fetch origin main
            if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
              echo "::error::Tag '$TAG' (commit $TAG_SHA) is not on main; nightly/stable deployments must be built from main."
              exit 1
            fi
          fi

      - name: Compile notification content
        if: ${{ always() }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "notification_content<<EOF"
            echo "## :rocket: Launching PUDL deployment for ${{ env.GIT_TAG }} (${{ env.DEPLOYMENT_ENVIRONMENT }})"
            echo ""
            echo "* [View this deploy-pudl.yml run]($RUN_URL)"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Notify Zulip of deployment start
        if: ${{ always() }}
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: "build-status-bot@catalyst-cooperative.zulipchat.com"
          organization-url: "https://catalyst-cooperative.zulipchat.com"
          type: "stream"
          to: "pudl-deployments"
          topic: "build-deploy-pudl"
          content: "${{ env.notification_content }}"

      - name: Docker Metadata
        id: docker_metadata
        uses: docker/metadata-action@v5
        with:
          images: catalystcoop/pudl-etl
          flavor: |
            latest=auto
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=ref,event=tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image and push to Docker Hub
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: builds/Dockerfile
          push: true
          tags: ${{ steps.docker_metadata.outputs.tags }}
          labels: ${{ steps.docker_metadata.outputs.labels }}
          # Docker caching temporarily disabled -- see docker-build-test.yml.

      - name: Determine container image to use
        id: container-image
        run: |
          echo "image=docker.io/catalystcoop/pudl-etl@${{ steps.docker_build.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - id: "auth"
        uses: "google-github-actions/auth@v3"
        with:
          workload_identity_provider: "projects/345950277072/locations/global/workloadIdentityPools/gh-actions-pool/providers/gh-actions-provider"
          service_account: "deploy-pudl-github-action@catalyst-cooperative-pudl.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Make GCP Batch config file
        run: |-
          ./devtools/generate_batch_config.py \
            --container-image "${{ steps.container-image.outputs.image }}" \
            --container-command "pixi" \
            --container-arg="run" \
            --container-arg="pudl_deploy" \
            --container-arg="${{ env.GIT_TAG }}" \
            --container-arg="--environment" \
            --container-arg="${{ env.DEPLOYMENT_ENVIRONMENT }}" \
            --container-env GITHUB_TOKEN=${{ secrets.PUDL_BOT_PAT }} \
            --container-env AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --container-env AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }} \
            --container-env AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --container-env ZULIP_API_KEY=${{ secrets.ZULIP_API_KEY }} \
            --container-env BATCH_JOB_NAME=${{ env.BATCH_JOB_NAME }} \
            --vcpu=8 \
            --mem-gb=31 \
            --disk-gb=100 \
            --output batch_job.json

      - name: Kick off batch job
        run: gcloud batch jobs submit ${{ env.BATCH_JOB_NAME }} --config batch_job.json --location us-east1

      - name: Status emoji
        if: ${{ always() }}
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "emoji=:check:" >> "$GITHUB_ENV"
          elif [[ "${{ job.status }}" == "failure" ]]; then
            echo "emoji=:x:" >> "$GITHUB_ENV"
          else
            echo "emoji=:warning:" >> "$GITHUB_ENV"
          fi

      - name: Notify Zulip of deployment batch job status
        if: ${{ always() }}
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: "build-status-bot@catalyst-cooperative.zulipchat.com"
          organization-url: "https://catalyst-cooperative.zulipchat.com"
          type: "stream"
          to: "pudl-deployments"
          topic: "build-deploy-pudl"
          content: >
            ${{ env.emoji }} PUDL deployment batch job for ${{ env.GIT_TAG }}
            (${{ env.DEPLOYMENT_ENVIRONMENT }}) launched with status: ${{ job.status }}.
